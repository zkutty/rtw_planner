# Render.com deployment configuration
# Memory-optimized: Uses SQLite instead of loading CSV into RAM

services:
  - type: web
    name: rtw-planner
    runtime: python
    buildCommand: pip install -r requirements.txt && python build_database.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_FILE
        value: "flights.db"
      - key: FLASK_ENV
        value: "production"
